<!DOCTYPE html>
<html lang="en" data-theme="dark" data-page="journal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Man Switch</title>
<style>
:root{--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
/* each page has its own accent, taken from the reference: violet, mint, orange */
:root[data-theme="dark"][data-page="journal"]{--bg:#120c1e;--sf:#1b1330;--ln:#322350;--ac:#b08cf6;--ak:#1b0d33;--mu:#9a8db5;--tx:#ece6f8}
:root[data-theme="dark"][data-page="task"]{--bg:#0a1512;--sf:#10211d;--ln:#1f3d35;--ac:#5fd9a8;--ak:#06231a;--mu:#82a89c;--tx:#e4f4ee}
:root[data-theme="dark"][data-page="important"]{--bg:#140e0b;--sf:#1f1511;--ln:#43291d;--ac:#f08a4b;--ak:#2a1204;--mu:#b39685;--tx:#f6ebe4}
:root[data-theme="light"][data-page="journal"]{--bg:#f6f2ff;--sf:#fff;--ln:#e2d8f5;--ac:#6d3fd1;--ak:#fff;--mu:#7b6e96;--tx:#241838}
:root[data-theme="light"][data-page="task"]{--bg:#eef8f4;--sf:#fff;--ln:#cfe8de;--ac:#14815d;--ak:#fff;--mu:#5d8074;--tx:#10281f}
:root[data-theme="light"][data-page="important"]{--bg:#fdf4ee;--sf:#fff;--ln:#f1d9c8;--ac:#bf4f12;--ak:#fff;--mu:#94705a;--tx:#33180a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.5;transition:background .2s}
.app{display:grid;grid-template-columns:210px 1fr;max-width:920px;margin:0 auto;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 14px;border-right:1px solid var(--ln)}
.brand{font-family:var(--serif);font-size:22px;color:var(--ac);padding:0 10px 14px}
nav{display:flex;flex-direction:column;gap:6px}
nav button{background:none;border:0;border-radius:10px;color:var(--mu);font:inherit;font-size:15px;text-align:left;padding:11px 12px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700;background:color-mix(in srgb,var(--ac) 15%,transparent)}
main{padding:24px 22px;max-width:660px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center}
.mbrand{display:none;font-family:var(--serif);font-size:20px;color:var(--ac)}
#themeBtn{margin-left:auto;background:none;border:1px solid var(--ln);color:var(--mu);border-radius:18px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;margin:10px 0 6px;color:var(--ac)}
.sub{margin:0 0 20px;color:var(--mu);font-size:16px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.composer{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-bottom:22px}
textarea{width:100%;border:0;background:transparent;color:var(--tx);font:inherit;font-size:16.5px;resize:none;min-height:74px}
textarea::placeholder{color:var(--mu)}
textarea:focus{outline:none}
.hint{font-size:12.5px;color:var(--mu);margin:0 0 8px}
#preview{position:relative;margin:4px 0 10px;display:none}
#preview img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;border:1px solid var(--ln)}
#rm{position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(0,0,0,.65);color:#fff;font-size:16px;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px}
.ic{background:none;border:1px solid var(--ln);border-radius:18px;color:var(--mu);padding:6px 13px;font:inherit;font-size:14px;cursor:pointer}
.ic:hover{color:var(--ac);border-color:var(--ac)}
.sp{flex:1}
#post{background:var(--ac);color:var(--ak);border:0;border-radius:20px;padding:9px 20px;font:inherit;font-weight:700;cursor:pointer}
#post:disabled{opacity:.45;cursor:default}
#msg{font-size:13px;color:var(--ac);min-height:18px;margin-top:6px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:12px;position:relative}
.meta{font-size:13px;color:var(--mu);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card-actions{display:flex;gap:8px}
.card-btn{background:none;border:0;border-radius:6px;color:var(--mu);font:inherit;font-size:12px;cursor:pointer;padding:4px 8px;border:1px solid var(--ln)}
.card-btn:hover{color:var(--ac);border-color:var(--ac)}
.note{white-space:pre-wrap;word-wrap:break-word;margin:0;font-size:16px}
.card img{display:block;width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin-top:10px}
.empty{padding:40px 16px;text-align:center;color:var(--mu);font-family:var(--serif);font-size:17px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:22px;max-width:500px;width:90%;max-height:85vh;overflow-y:auto}
.modal-content h2{font-family:var(--serif);font-size:28px;margin:0 0 16px;color:var(--ac)}
.modal-content textarea{margin-bottom:12px}
.modal-content select{width:100%;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);padding:8px 12px;font:inherit;margin-bottom:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{background:none;border:1px solid var(--ln);border-radius:10px;color:var(--mu);padding:8px 16px;font:inherit;cursor:pointer}
.modal-btn:hover{color:var(--ac);border-color:var(--ac)}
.modal-btn.save{background:var(--ac);color:var(--ak);border:0;font-weight:700}
.modal-btn.save:disabled{opacity:.45;cursor:default}
@media (max-width:759px){
  .app{display:block}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;padding:0 0 env(safe-area-inset-bottom);border:0;border-top:1px solid var(--ln);background:var(--sf);z-index:9}
  .brand{display:none}.mbrand{display:block}
  nav{flex-direction:row;gap:0}
  nav button{flex:1;text-align:center;border-radius:0;padding:15px 4px}
  main{padding:18px 16px 96px}
  h1{font-size:34px}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="brand">Man Switch</div>
    <nav id="nav">
      <button data-page="journal" class="on">Journal</button>
      <button data-page="task">Tasks / Goals</button>
      <button data-page="important">Important</button>
    </nav>
  </div>

  <main>
    <div class="top"><span class="mbrand">Man Switch</span><button id="themeBtn" type="button">Light</button></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>

    <section class="composer">
      <textarea id="note" maxlength="2000"></textarea>
      <p class="hint" id="hint"></p>
      <div id="preview"><img id="prevImg" alt="Selected photo"><button id="rm" type="button" aria-label="Remove photo">&times;</button></div>
      <div class="bar">
        <button class="ic" id="gal" type="button">Photo</button>
        <button class="ic" id="cam" type="button">Camera</button>
        <span class="sp"></span>
        <button id="post" type="button">Check in</button>
      </div>
      <div id="msg" role="status"></div>
      <input type="file" id="fGal" accept="image/jpeg,image/png,image/webp" hidden>
      <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
    </section>

    <div id="feed"><div class="empty">Loading...</div></div>
  </main>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h2>Edit Entry</h2>
    <textarea id="editNote" maxlength="2000" style="width:100%;border:1px solid var(--ln);border-radius:8px;padding:8px;background:var(--bg);color:var(--tx);font:inherit;min-height:100px;resize:none"></textarea>
    <select id="editCategory">
      <option value="journal">Journal</option>
      <option value="task">Tasks / Goals</option>
      <option value="important">Important</option>
    </select>
    <div id="editPreview" style="position:relative;margin:12px 0;display:none">
      <img id="editPreviewImg" alt="Current photo" style="width:100%;max-height:250px;object-fit:cover;border-radius:8px">
      <button id="editRemoveImg" type="button" aria-label="Remove photo" style="position:absolute;top:8px;right:8px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(0,0,0,.65);color:#fff;font-size:16px;cursor:pointer">&times;</button>
    </div>
    <button class="ic" id="editGal" type="button" style="width:100%;margin-bottom:8px">Replace Photo (Gallery)</button>
    <button class="ic" id="editCam" type="button" style="width:100%;margin-bottom:12px">Replace Photo (Camera)</button>
    <input type="file" id="editFGal" accept="image/jpeg,image/png,image/webp" hidden>
    <input type="file" id="editFCam" accept="image/*" capture="environment" hidden>
    <div id="editMsg" style="font-size:13px;color:var(--ac);min-height:18px;margin-bottom:12px"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="editCancel">Cancel</button>
      <button class="modal-btn save" id="editSave">Save</button>
    </div>
  </div>
</div>

<script>
const COPY = {
  journal:{t:"Journal",s:"Your thoughts, progress and everything in between.",ph:"What's on your mind today?",hint:""},
  task:{t:"Tasks / Goals",s:"Turn your plans into progress.",ph:"What are you working on, and what's next?",hint:""},
  important:{t:"Important saved",s:"Your links, notes and important stuff in one place.",ph:"Save a link, number or note",hint:"Keep real passwords in a password manager, not here."}
};
let page = "journal", file = null, editingId = null, editFile = null;
const $ = id => document.getElementById(id);
const root = document.documentElement;

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function when(iso){
  const d=new Date(iso);
  if(isNaN(d))return "";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}

/* theme: dark by default to match the reference; the toggle switches to light */
function setTheme(t){
  root.dataset.theme=t;
  $("themeBtn").textContent=t==="dark"?"Light":"Dark";
  try{localStorage.setItem("theme",t)}catch(e){}
}
let saved="dark";
try{saved=localStorage.getItem("theme")||"dark"}catch(e){}
setTheme(saved);
$("themeBtn").onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark");

/* pages */
function showPage(p){
  page=p;
  root.dataset.page=p;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.page===p));
  $("title").textContent=COPY[p].t;
  $("sub").textContent=COPY[p].s;
  $("note").placeholder=COPY[p].ph;
  $("hint").textContent=COPY[p].hint;
  $("hint").style.display=COPY[p].hint?"block":"none";
  loadFeed();
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>showPage(b.dataset.page));

/* feed */
async function loadFeed(){
  $("feed").innerHTML='<div class="empty">Loading...</div>';
  const mine=page;
  try{
    const r=await fetch("/history?category="+mine);
    if(!r.ok)throw new Error();
    const rows=await r.json();
    if(mine!==page)return;
    if(!rows.length){$("feed").innerHTML='<div class="empty">Nothing here yet. Write your first entry above.</div>';return}
    $("feed").innerHTML=rows.map(p=>`
      <article class="card" data-id="${p.id}">
        <div class="meta">
          <span>${esc(when(p.timestamp))}</span>
          <div class="card-actions">
            <button class="card-btn edit-btn" data-id="${p.id}">Edit</button>
            <button class="card-btn delete-btn" data-id="${p.id}">Delete</button>
          </div>
        </div>
        <p class="note">${esc(p.progress_note)}</p>
        ${p.image_url?`<img src="${esc(p.image_url)}" alt="Attached photo" loading="lazy">`:""}
      </article>`).join("");
    
    document.querySelectorAll(".edit-btn").forEach(btn=>{
      btn.onclick=()=>openEditModal(parseInt(btn.dataset.id));
    });
    document.querySelectorAll(".delete-btn").forEach(btn=>{
      btn.onclick=()=>deleteEntry(parseInt(btn.dataset.id));
    });
  }catch(e){
    $("feed").innerHTML='<div class="empty">Couldn\'t load entries. Refresh to try again.</div>';
  }
}

/* modal */
function openEditModal(id){
  const card = document.querySelector(`[data-id="${id}"]`);
  const note = card.querySelector(".note").textContent;
  const img = card.querySelector("img");
  
  editingId = id;
  editFile = null;
  $("editNote").value = note;
  $("editMsg").textContent = "";
  
  if(img){
    $("editPreview").style.display = "block";
    $("editPreviewImg").src = img.src;
  } else {
    $("editPreview").style.display = "none";
  }
  
  $("editModal").classList.add("active");
}

function closeEditModal(){
  $("editModal").classList.remove("active");
  editingId = null;
  editFile = null;
}

$("editCancel").onclick = closeEditModal;

function pickEditFile(f){
  if(!f)return;
  if(f.size>5*1024*1024){$("editMsg").textContent="That photo is over 5 MB. Pick a smaller one.";return}
  editFile=f;
  $("editPreviewImg").src=URL.createObjectURL(f);
  $("editPreview").style.display="block";
  $("editMsg").textContent="";
}

$("editGal").onclick=()=>$("editFGal").click();
$("editCam").onclick=()=>$("editFCam").click();
$("editFGal").onchange=e=>{pickEditFile(e.target.files[0]);e.target.value=""};
$("editFCam").onchange=e=>{pickEditFile(e.target.files[0]);e.target.value=""};
$("editRemoveImg").onclick=()=>{editFile=null;$("editPreview").style.display="none"};

$("editSave").onclick=async()=>{
  const note=$("editNote").value.trim();
  if(!note){$("editMsg").textContent="Write something first.";return}
  
  const fd=new FormData();
  fd.append("note",note);
  fd.append("category",$("editCategory").value);
  if(editFile)fd.append("image",editFile);
  
  $("editSave").disabled=true;
  $("editMsg").textContent="Saving...";
  
  try{
    const r=await fetch(`/checkin/${editingId}`,{method:"PUT",body:fd});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||"Update failed")}
    $("editMsg").textContent="Updated.";
    await loadFeed();
    closeEditModal();
  }catch(e){
    $("editMsg").textContent=e.message||"Update failed. Try again.";
  }finally{
    $("editSave").disabled=false;
  }
};

/* delete */
async function deleteEntry(id){
  if(!confirm("Are you sure? This cannot be undone."))return;
  try{
    const r=await fetch(`/checkin/${id}`,{method:"DELETE"});
    if(!r.ok)throw new Error("Delete failed");
    await loadFeed();
  }catch(e){
    alert("Failed to delete: "+(e.message||"Try again"));
  }
}

/* photo picking: gallery and camera feed the same slot */
function pick(f){
  if(!f)return;
  if(f.size>5*1024*1024){$("msg").textContent="That photo is over 5 MB. Pick a smaller one.";return}
  file=f;
  $("prevImg").src=URL.createObjectURL(f);
  $("preview").style.display="block";
  $("msg").textContent="";
}
$("gal").onclick=()=>$("fGal").click();
$("cam").onclick=()=>$("fCam").click();
$("fGal").onchange=e=>{pick(e.target.files[0]);e.target.value=""};
$("fCam").onchange=e=>{pick(e.target.files[0]);e.target.value=""};
$("rm").onclick=()=>{file=null;$("preview").style.display="none"};

/* posting */
$("post").onclick=async()=>{
  const note=$("note").value.trim();
  if(!note){$("msg").textContent="Write something first.";return}
  const fd=new FormData();
  fd.append("note",note);
  fd.append("category",page);
  if(file)fd.append("image",file);
  $("post").disabled=true;
  $("msg").textContent="Checking in...";
  try{
    const r=await fetch("/checkin",{method:"POST",body:fd});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||"Check-in failed")}
    $("note").value="";file=null;$("preview").style.display="none";
    $("msg").textContent="Checked in.";
    await loadFeed();
  }catch(e){
    $("msg").textContent=e.message||"Check-in failed. Try again.";
  }finally{
    $("post").disabled=false;
  }
};

showPage("journal");
</script>
</body>
</html>
