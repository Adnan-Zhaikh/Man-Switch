<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEADMAN::SWITCH</title>
<style>
  :root {
    --amber: #ffb000;
    --amber-dim: #a66f00;
    --amber-bright: #ffd166;
    --bg: #0d0b08;
    --panel: #16130d;
    --border: #3a2f1a;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--amber);
    font-family: 'Courier New', Courier, monospace;
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 64px;
    line-height: 1.5;
  }

  .ascii-header {
    white-space: pre;
    font-size: 10px;
    color: var(--amber-dim);
    text-align: center;
    margin-bottom: 8px;
    overflow-x: auto;
  }

  h1 {
    text-align: center;
    letter-spacing: 4px;
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--amber-bright);
    text-shadow: 0 0 8px rgba(255, 176, 0, 0.35);
  }

  .subtitle {
    text-align: center;
    color: var(--amber-dim);
    font-size: 12px;
    margin-bottom: 32px;
    letter-spacing: 2px;
  }

  .panel {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 20px;
    margin-bottom: 24px;
    position: relative;
  }

  .panel::before {
    content: "// " attr(data-label);
    position: absolute;
    top: -10px;
    left: 12px;
    background: var(--bg);
    padding: 0 8px;
    font-size: 11px;
    color: var(--amber-dim);
    letter-spacing: 2px;
  }

  input[type="text"] {
    width: 100%;
    background: #0a0806;
    border: 1px solid var(--border);
    color: var(--amber-bright);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--amber);
  }

  button {
    width: 100%;
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 3px;
    padding: 12px;
    cursor: pointer;
    transition: 0.15s;
  }

  button:hover {
    background: var(--amber);
    color: var(--bg);
  }

  button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .status {
    margin-top: 12px;
    font-size: 12px;
    min-height: 16px;
    color: var(--amber-bright);
  }

  .status.error { color: #ff5f4d; }

  .log-entry {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px dotted var(--border);
    font-size: 13px;
  }

  .log-entry:last-child { border-bottom: none; }

  .log-note { color: var(--amber-bright); }

  .log-time {
    color: var(--amber-dim);
    white-space: nowrap;
    font-size: 11px;
  }

  .empty {
    color: var(--amber-dim);
    font-size: 12px;
    text-align: center;
    padding: 12px 0;
  }

  .blink {
    animation: blink 1.2s steps(2, start) infinite;
  }

  @keyframes blink {
    to { visibility: hidden; }
  }
</style>
</head>
<body>

  <div class="ascii-header">╔═══════════════════════════════╗
║   S Y S T E M   O N L I N E   ║
╚═══════════════════════════════╝</div>
  <h1>DEADMAN::SWITCH</h1>
  <div class="subtitle">&gt; proof of life required<span class="blink">_</span></div>

  <div class="panel" data-label="check_in">
    <input type="text" id="noteInput" placeholder="progress note..." autocomplete="off">
    <button id="checkinBtn">[ CHECK IN ]</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <div class="panel" data-label="history_log">
    <div id="historyList">
      <div class="empty">loading log...</div>
    </div>
  </div>

<script>
  const noteInput = document.getElementById('noteInput');
  const checkinBtn = document.getElementById('checkinBtn');
  const statusMsg = document.getElementById('statusMsg');
  const historyList = document.getElementById('historyList');

  function formatTimestamp(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  async function loadHistory() {
    try {
      const res = await fetch('/history');
      if (!res.ok) throw new Error('failed to load');
      const rows = await res.json();

      if (!rows.length) {
        historyList.innerHTML = '<div class="empty">no entries yet</div>';
        return;
      }

      historyList.innerHTML = rows.map(row => {
        // row = [id, timestamp, progress_note]
        const [, timestamp, note] = row;
        return `<div class="log-entry">
          <span class="log-note">${escapeHtml(note)}</span>
          <span class="log-time">${formatTimestamp(timestamp)}</span>
        </div>`;
      }).join('');
    } catch (err) {
      historyList.innerHTML = '<div class="empty">:: failed to load log ::</div>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function checkIn() {
    const note = noteInput.value.trim();
    if (!note) {
      statusMsg.textContent = ':: note required ::';
      statusMsg.className = 'status error';
      return;
    }

    checkinBtn.disabled = true;
    statusMsg.textContent = 'transmitting...';
    statusMsg.className = 'status';

    try {
      const res = await fetch(`/checkin?note=${encodeURIComponent(note)}`, {
        method: 'POST'
      });
      if (!res.ok) throw new Error('request failed');

      statusMsg.textContent = ':: check-in logged ::';
      noteInput.value = '';
      await loadHistory();
    } catch (err) {
      statusMsg.textContent = ':: transmission failed ::';
      statusMsg.className = 'status error';
    } finally {
      checkinBtn.disabled = false;
    }
  }

  checkinBtn.addEventListener('click', checkIn);
  noteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkIn();
  });

  loadHistory();
</script>

</body>
</html>
